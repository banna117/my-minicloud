apiVersion: v1                       # Service 리소스의 API 버전
kind: Service                        # 리소스 종류: Service(접근 경로 제공)
metadata:
  name: ai-service                   # Service 이름
  namespace: mincloud                # 같은 네임스페이스 내의 파드들에 연결
  labels:
    app.kubernetes.io/name: ai-inference
spec:
  type: NodePort                     # 외부 접근 가능하도록 하는 타입(개발/로컬에 적합)
  selector:                          # 어떤 파드들에 트래픽을 보낼지(라벨 매칭)
    app: ai-inference                # Deployment의 template.labels와 동일해야 함
  ports:
    - name: http
      protocol: TCP
      port: 5000                     # 클러스터 내부에서 이 서비스에 접근할 때 사용할 포트
      targetPort: 5000               # 파드(컨테이너) 내부 포트
      nodePort: 30007                # 노드 외부에서 접근할 포트(30000~32767 범위). 비워두면 자동 할당.
