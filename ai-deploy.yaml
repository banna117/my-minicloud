apiVersion: apps/v1                  # Deployment 리소스의 API 버전
kind: Deployment                     # 리소스 종류: Deployment(파드의 선언적 관리)
metadata:
  name: ai-inference                 # Deployment 이름 (동일 네임스페이스 내에서 유일)
  namespace: mincloud                # 배포할 네임스페이스 (미생성 시: kubectl create namespace mincloud)
  labels:                            # 이 Deployment 리소스 자체에 붙는 라벨(선택)
    app.kubernetes.io/name: ai-inference
spec:
  replicas: 1                        # 유지할 파드(Pod) 개수 (수평 확장 시 여기 숫자만 늘리면 됨)
  revisionHistoryLimit: 5            # 롤백 이력 유지 개수 (기본 10, 줄이면 리소스 절약)
  selector:                          # 이 Deployment가 관리할 파드를 찾는 규칙
    matchLabels:
      app: ai-inference              # 아래 template.metadata.labels와 반드시 일치해야 함
  strategy:                          # 롤링 업데이트 전략(선택)
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0              # 업데이트 중 동시에 내려갈 수 있는 파드 수
      maxSurge: 1                    # 업데이트 중 동시에 새로 띄울 수 있는 파드 수
  template:                          # 실제로 생성할 파드의 템플릿
    metadata:
      labels:                        # 파드에 붙는 라벨 (Service selector가 이 라벨로 파드를 찾는다)
        app: ai-inference
    spec:
      # nodeSelector / tolerations / affinity 등으로 배치 정책을 줄 수도 있음
      containers:
        - name: ai-container         # 컨테이너 이름
          image: my-ai-inference:latest  # 사용할 이미지 (로컬 이미지를 쓰면 minikube에 로드 필요: minikube image load ...)
          imagePullPolicy: IfNotPresent   # 이미지 풀 정책(로컬 개발은 보통 IfNotPresent)
          ports:
            - containerPort: 5000    # 컨테이너 내부에서 AI API가 리스닝하는 포트
              name: http             # 포트 이름(Probe/Service에서 name으로 참조 가능)
              protocol: TCP
          env:                       # 환경변수 예시 (필요 시 추가)
            - name: MODEL_NAME
              value: "sentiment-analysis"
          resources:                 # 리소스 요청/제한(개발 환경에서는 완화해도 됨)
            requests:
              cpu: "200m"            # 최소 보장(스케줄링 기준)
              memory: "256Mi"
            limits:
              cpu: "1"               # 상한
              memory: "1Gi"
          # 라이브니스/레디니스 프로브로 헬스체크 (엔드포인트가 있다면 적극 권장)
          readinessProbe:
            httpGet:
              path: /healthz         # 애플리케이션이 준비되었는지 확인(예: 200 OK)
              port: http             # 위 ports.name 참조 가능 (또는 5000 숫자 사용)
            initialDelaySeconds: 8    # 컨테이너 시작 후 처음 체크까지 대기
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # 로그가 많다면 terminationGracePeriodSeconds와 함께 종료 신호 처리 로직도 구현 권장
      terminationGracePeriodSeconds: 30  # 종료 시 SIGTERM 후 강제종료까지 기다리는 시간(초)
